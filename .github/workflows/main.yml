name: Extract TODO project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TODO ZIP
        run: |
          unzip -o TODO_v0_1.zip -d extracted
          cp -r extracted/TODO_v0_1/. .
          rm -rf extracted TODO_v0_1.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract TODO Android project" || echo "No changes to commit"
          git push
